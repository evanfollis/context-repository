# Repository declaration — see supervisor/docs/repository-architecture-standard.md §1 (ADR-0050).
# Descriptive metadata only. Not a runtime state model; not canon phase; not deploy state.

schema_version = 1
name = "context-repository"

# This repo is a published specification + conformance bundle (canon) plus the
# agent-context-repo pattern lab. Its authoritative output is consumed by other
# repos as a contract — see docs/architecture.md §Published interface.
shape = "contract"

# Actively maintained: canon evolves through reviewed spec bumps (latest v0.2.0).
lifecycle = "active"

# The repo ships NO model-controlled execution: no agent, runner, prompt builder,
# or LLM-invoking code. `conformance/run.py` is a deterministic JSON-Schema
# validator. Reflection/tick sessions that EDIT this repo are part of the host
# session fabric, governed by the control-plane containment gap register
# (supervisor/system/agentic-safety-gap-register.md), not by code shipped here.
agentic_risk = "none"

canonical_repository = "https://github.com/evanfollis/context-repository"

[artifacts]
# Only paths whose invariants `make check` actually enforces are declared here
# (standard §1: "an unenforced path catalog is worse than no catalog").
# Enforced by scripts/validate_repo.py: authoritative paths must exist; runtime
# and generated paths must exist AND be gitignored.
authoritative = [
  "spec/discovery-framework",  # the published contract (schemas + conformance + prose)
  "docs",
  "scripts",
  "AGENTS.md",
  "CLAUDE.md",
  "CURRENT_STATE.md",
  "README.md",
  "Makefile",
  "requirements.txt",
]
runtime = []       # this repo holds no mutable runtime state in-tree
historical = []    # no frozen/retired lineage tracked in-tree

# NOTE on the generated artifact `index.md`: it is generated by
# scripts/build-index.sh AND tracked (it is the repo's browsable table of
# contents on GitHub). Per standard §5 that is a tracked reproducibility
# artifact, which must be gitignored to appear under `generated` here — it is
# not. Instead its rebuild-clean contract is enforced directly by
# `make check` (target `check-index`), so it is deliberately omitted from
# [artifacts].generated rather than declared under a rule it would fail.
