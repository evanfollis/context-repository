name: check

# Runs the repository's canonical gate (`make check`) on every push and PR.
# This repo is shape=contract: the gate is repo.toml validation, spec-version
# consistency, schema parseability, canon conformance (19/19), and index freshness.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the check needs only to read the checkout.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python@v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: make setup
      - name: Run gate
        run: make check
